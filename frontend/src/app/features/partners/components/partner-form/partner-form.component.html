<!-- partner-form.component.html -->
<div class="partner-form-container">
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{isEditMode ? 'Modifier' : 'Ajouter'}} un partenaire</mat-card-title>
      </mat-card-header>
      
      <mat-card-content>
        <ng-container *ngIf="loading">
          <app-loading-spinner></app-loading-spinner>
        </ng-container>
        
        <ng-container *ngIf="!loading">
          <form [formGroup]="partnerForm" (ngSubmit)="savePartner()">
            <!-- Alias -->
            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Alias</mat-label>
              <input matInput formControlName="alias" placeholder="Alias du partenaire" required>
              <mat-error *ngIf="partnerForm.get('alias')?.hasError('required')">
                L'alias est obligatoire
              </mat-error>
            </mat-form-field>
            
            <!-- Type -->
            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Type</mat-label>
              <input matInput formControlName="type" placeholder="Type du partenaire" required>
              <mat-error *ngIf="partnerForm.get('type')?.hasError('required')">
                Le type est obligatoire
              </mat-error>
            </mat-form-field>
            
            <!-- Direction -->
            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Direction</mat-label>
              <mat-select formControlName="direction" required>
                <mat-option *ngFor="let direction of directions" [value]="direction">
                  {{direction}}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="partnerForm.get('direction')?.hasError('required')">
                La direction est obligatoire
              </mat-error>
            </mat-form-field>
            
            <!-- Application -->
            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Application</mat-label>
              <input matInput formControlName="application" placeholder="Application (optionnel)">
            </mat-form-field>
            
            <!-- Processed Flow Type -->
            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Type de flux traité</mat-label>
              <mat-select formControlName="processedFlowType" required>
                <mat-option *ngFor="let flowType of flowTypes" [value]="flowType">
                  {{flowType}}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="partnerForm.get('processedFlowType')?.hasError('required')">
                Le type de flux traité est obligatoire
              </mat-error>
            </mat-form-field>
            
            <!-- Description -->
            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Description</mat-label>
              <textarea matInput formControlName="description" placeholder="Description du partenaire" rows="4" required></textarea>
              <mat-error *ngIf="partnerForm.get('description')?.hasError('required')">
                La description est obligatoire
              </mat-error>
            </mat-form-field>
            
            <div class="form-actions">
              <button mat-button type="button" (click)="cancel()">Annuler</button>
              <button mat-raised-button color="primary" type="submit" [disabled]="loading">
                {{isEditMode ? 'Mettre à jour' : 'Créer'}}
              </button>
            </div>
          </form>
        </ng-container>
      </mat-card-content>
    </mat-card>
  </div>
