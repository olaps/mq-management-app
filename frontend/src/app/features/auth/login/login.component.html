<div class="login-container">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Connexion</mat-card-title>
      </mat-card-header>
      
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nom d'utilisateur</mat-label>
            <input matInput formControlName="username" placeholder="Nom d'utilisateur">
            <mat-error *ngIf="submitted && f['username'].errors?.['required']">
              Le nom d'utilisateur est requis
            </mat-error>
          </mat-form-field>
          
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Mot de passe</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Mot de passe">
            <mat-error *ngIf="submitted && f['password'].errors?.['required']">
              Le mot de passe est requis
            </mat-error>
          </mat-form-field>
          
          <div *ngIf="error" class="error-message">
            {{error}}
          </div>
          
          <div class="action-buttons">
            <button mat-raised-button color="primary" type="submit" [disabled]="loading">
              <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
              <span *ngIf="!loading">Se connecter</span>
            </button>
            <a mat-button routerLink="/register">Créer un compte</a>
          </div>
          
        </form>
      </mat-card-content>
    </mat-card>
  </div>
